name: 工作台数据定时刷新（舆情/热榜/篮球/虎扑）

on:
  schedule:
    # 每 2 小时跑一次（北京 0/2/4/6...22 点整），保证全天数据及时更新
    # 想更频繁可改为 "0 * * * *"（每小时）；想更省可改回 "0 23 * * *"（每天一次）
    - cron: "0 */2 * * *"
  # 允许在 GitHub 仓库的 Actions 页面手动点一下立即触发
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取篮球数据（ESPN 官方）
        run: python basketball.py

      - name: 回填队徽/背景图（GHA 无客户端上传脚本，复用线上已有图片）
        run: python merge_basketball_logos.py

      - name: 刷新舆情/热榜快照并合并篮球
        run: python refresh_snapshot.py
